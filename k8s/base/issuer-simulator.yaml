# Keeps state in memory (H2): run exactly 1 replica. Replace with the real network link in production.
apiVersion: v1
kind: Service
metadata:
  name: issuer-simulator
  labels: { app: issuer-simulator }
spec:
  selector: { app: issuer-simulator }
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuer-simulator
  labels: { app: issuer-simulator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: issuer-simulator }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: issuer-simulator }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: issuer-simulator
          image: pos/issuer-simulator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: pos-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
