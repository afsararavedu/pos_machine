apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pos-payments

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - kafka.yaml
  - auth-service.yaml
  - issuer-simulator.yaml
  - payment-service.yaml
  - reports-service.yaml
  - network-policies.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: pos-payments
    includeSelectors: false
