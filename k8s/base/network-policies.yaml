# The issuer link is the most sensitive hop (it carries card numbers): only payment-service may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: issuer-only-from-payment-service
spec:
  podSelector:
    matchLabels: { app: issuer-simulator }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: payment-service }
      ports:
        - port: 8083
---
# Databases and Kafka are reachable from the application pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores-from-apps-only
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, kafka] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [auth-service, payment-service, reports-service, kafka] }
