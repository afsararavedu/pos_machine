# Consumers in one group share partitions; more replicas than partitions just idle.
apiVersion: v1
kind: Service
metadata:
  name: reports-service
  labels: { app: reports-service }
spec:
  selector: { app: reports-service }
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  labels: { app: reports-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: reports-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: reports-service }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: reports-service
          image: pos/reports-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: pos-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/reports_db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pos-secrets
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
